name: Release

# Builds versioned plugin packages and attaches them to a GitHub Release.
# Triggered only by an explicit v* tag (or manual dispatch for a dry-run build).
# Ordinary pushes never publish a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag without creating a release (e.g. v0.1.0). Empty = github.ref_name.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            verify_os: macOS
            zip_prefix: macOS
          - os: windows-2022
            name: Windows
            verify_os: Windows
            zip_prefix: Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            RAW="${{ github.event.inputs.tag }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          # Accept "v0.1.0" or "0.1.0"
          VER="${RAW#v}"
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Refusing non-semver-like version: '${RAW}'"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Building release artefacts for v${VER}"

      - name: Check version matches CMake
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_VER="$(grep -E '^\s*VERSION\s+[0-9]' CMakeLists.txt | head -1 | awk '{print $2}')"
          TAG_VER="${{ steps.ver.outputs.version }}"
          echo "CMake project version: ${CMAKE_VER}"
          echo "Release tag version:   ${TAG_VER}"
          if [[ "${CMAKE_VER}" != "${TAG_VER}" ]]; then
            echo "::error::Tag v${TAG_VER} does not match CMakeLists.txt VERSION ${CMAKE_VER}."
            echo "Bump project(AETHR VERSION …) before tagging, or retag to match."
            exit 1
          fi

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Enable MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build/ci/_deps
            External/JUCE
            External/Catch2
          key: deps-v2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            deps-v2-${{ runner.os }}-

      - name: Configure
        run: |
          cmake --preset ci
          test -f build/ci/CMakeCache.txt || (echo "Configure did not produce CMakeCache.txt" && exit 1)

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Unit / DSP / Engine tests
        run: ctest --preset ci --output-on-failure --parallel

      - name: Verify plugin artefacts
        shell: bash
        run: |
          chmod +x Tools/ci-verify-artefacts.sh
          ./Tools/ci-verify-artefacts.sh \
            build/ci/Aethr_artefacts/RelWithDebInfo \
            "${{ matrix.verify_os }}"

      - name: Packaging (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          ART="build/ci/Aethr_artefacts/RelWithDebInfo"
          STAGE="dist/stage"
          mkdir -p "${STAGE}"
          cp -R "$ART/VST3/AETHR.vst3" "${STAGE}/"
          cp -R "$ART/AU/AETHR.component" "${STAGE}/"
          cp -R "$ART/Standalone/AETHR.app" "${STAGE}/"
          (cd "${STAGE}" && zip -ry "../AETHR-v${VER}-macOS.zip" .)
          ls -la dist
          unzip -l "dist/AETHR-v${VER}-macOS.zip"

      - name: Packaging (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          $art = 'build/ci/Aethr_artefacts/RelWithDebInfo'
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item -Recurse "$art/VST3/AETHR.vst3" dist/stage/
          Copy-Item "$art/Standalone/AETHR.exe" dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/AETHR-v${ver}-Windows.zip" -Force
          Get-ChildItem dist

      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: AETHR-v${{ steps.ver.outputs.version }}-${{ matrix.zip_prefix }}
          path: dist/AETHR-v${{ steps.ver.outputs.version }}-*.zip
          if-no-files-found: error

  publish:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    # Only attach assets when this run was triggered by a real v* tag push.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f -name '*.zip' | sort

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AETHR ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: release-assets/**/*.zip
          fail_on_unmatched_files: true
          body: |
            ## Packages

            | Platform | Archive |
            |----------|---------|
            | macOS (VST3 + AU + Standalone) | `AETHR-${{ github.ref_name }}-macOS.zip` |
            | Windows (VST3 + Standalone) | `AETHR-${{ github.ref_name }}-Windows.zip` |

            Install steps: see `docs/INSTALL.md` in the repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
