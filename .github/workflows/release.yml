name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.1.0). Leave empty to use github.ref_name.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            verify_os: macOS
            zip_prefix: macOS
          - os: windows-2022
            name: Windows
            verify_os: Windows
            zip_prefix: Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building release artefacts for v${TAG}"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Enable MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Unit / DSP / Engine tests
        run: ctest --preset ci --output-on-failure --parallel

      - name: Verify plugin artefacts
        shell: bash
        run: |
          chmod +x Tools/ci-verify-artefacts.sh
          ./Tools/ci-verify-artefacts.sh \
            build/ci/Aethr_artefacts/RelWithDebInfo \
            "${{ matrix.verify_os }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          ART="build/ci/Aethr_artefacts/RelWithDebInfo"
          mkdir -p dist/stage
          cp -R "$ART/VST3/AETHR.vst3" dist/stage/
          cp -R "$ART/AU/AETHR.component" dist/stage/
          cp -R "$ART/Standalone/AETHR.app" dist/stage/
          (cd dist/stage && zip -r "../AETHR-v${VER}-macOS.zip" .)
          ls -la dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          $art = 'build/ci/Aethr_artefacts/RelWithDebInfo'
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item -Recurse "$art/VST3/AETHR.vst3" dist/stage/
          Copy-Item "$art/Standalone/AETHR.exe" dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/AETHR-v${ver}-Windows.zip" -Force
          Get-ChildItem dist

      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: AETHR-v${{ steps.ver.outputs.version }}-${{ matrix.zip_prefix }}
          path: dist/AETHR-v${{ steps.ver.outputs.version }}-*.zip
          if-no-files-found: error

  publish:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
