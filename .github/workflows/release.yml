name: Release

# Tag-triggered professional installers (DMG + EXE) + checksums.
# Ordinary pushes never publish a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag dry-run (e.g. v0.95.0). Empty = github.ref_name.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            name: macOS
            verify_os: macOS
            cmake_preset: release
            build_config: Release
            artefact_name: macos
          - os: windows-2022
            name: Windows
            verify_os: Windows
            cmake_preset: windows-release
            build_config: Release
            artefact_name: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            RAW="${{ github.event.inputs.tag }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VER="${RAW#v}"
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Refusing non-semver-like version: '${RAW}'"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Check version matches CMake
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_VER="$(grep -E '^\s*VERSION\s+[0-9]' CMakeLists.txt | head -1 | awk '{print $2}')"
          TAG_VER="${{ steps.ver.outputs.version }}"
          echo "CMake project version: ${CMAKE_VER}"
          echo "Release tag version:   ${TAG_VER}"
          if [[ "${CMAKE_VER}" != "${TAG_VER}" ]]; then
            echo "::error::Tag v${TAG_VER} does not match CMakeLists.txt VERSION ${CMAKE_VER}."
            exit 1
          fi

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja + Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja innosetup -y

      - name: Enable MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.cmake_preset }}/_deps
            External/JUCE
            External/Catch2
          key: deps-v3-${{ runner.os }}-${{ matrix.cmake_preset }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            deps-v3-${{ runner.os }}-${{ matrix.cmake_preset }}-

      - name: Configure
        run: |
          cmake --preset ${{ matrix.cmake_preset }}
          test -f build/${{ matrix.cmake_preset }}/CMakeCache.txt

      - name: Build
        run: cmake --build --preset ${{ matrix.cmake_preset }} --parallel

      - name: Unit / DSP / Engine tests
        run: ctest --test-dir build/${{ matrix.cmake_preset }} --output-on-failure --parallel

      - name: Verify plugin artefacts
        shell: bash
        run: |
          chmod +x Tools/ci-verify-artefacts.sh
          ./Tools/ci-verify-artefacts.sh \
            "build/${{ matrix.cmake_preset }}/Aethr_artefacts/${{ matrix.build_config }}" \
            "${{ matrix.verify_os }}"

      - name: Pluginval (macOS VST3)
        if: runner.os == 'macOS'
        run: |
          chmod +x Tools/fetch-pluginval.sh
          ./Tools/fetch-pluginval.sh v1.0.4
          PLUGINVAL="Tools/pluginval.app/Contents/MacOS/pluginval"
          test -x "${PLUGINVAL}"
          "${PLUGINVAL}" \
            --strictness-level 8 \
            --validate-in-process \
            --skip-gui-tests \
            --output-dir build/${{ matrix.cmake_preset }}/pluginval \
            "build/${{ matrix.cmake_preset }}/Aethr_artefacts/${{ matrix.build_config }}/VST3/AETHR.vst3"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_INSTALLER_ID: ${{ secrets.APPLE_INSTALLER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          chmod +x Tools/package_macos.sh Tools/validate_macos_package.sh Tools/sanitise-macos-bundle.sh
          cmake --build --preset ${{ matrix.cmake_preset }} --target package-macos
          test -f "dist/macos/AETHR-${{ steps.ver.outputs.version }}-macOS.dmg"
          test -f "dist/macos/AETHR-${{ steps.ver.outputs.version }}-macOS.pkg"
          cat dist/macos/PACKAGING_STATUS.txt

      - name: Package Windows EXE
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_PATH: ${{ secrets.WINDOWS_CERT_PATH }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.cmake_preset }} --target package-windows
          if (-not (Test-Path "dist/windows/AETHR-${{ steps.ver.outputs.version }}-Windows.exe")) {
            throw "Windows installer missing"
          }
          Get-Content dist/windows/PACKAGING_STATUS.txt

      - name: Upload installer artefacts
        uses: actions/upload-artifact@v4
        with:
          name: AETHR-v${{ steps.ver.outputs.version }}-${{ matrix.artefact_name }}
          path: |
            dist/macos/AETHR-*-macOS.dmg
            dist/macos/AETHR-*-macOS.pkg
            dist/macos/PACKAGING_STATUS.txt
            dist/windows/AETHR-*-Windows.exe
            dist/windows/PACKAGING_STATUS.txt
          if-no-files-found: error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ matrix.artefact_name }}
          path: |
            build/${{ matrix.cmake_preset }}/Testing/Temporary/
            build/${{ matrix.cmake_preset }}/pluginval/
          if-no-files-found: ignore

  publish:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout (for release notes template)
        uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect installers + checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p upload
          find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.pkg' -o -name 'PACKAGING_STATUS.txt' \) -print
          find release-assets -type f \( -name 'AETHR-*-macOS.dmg' -o -name 'AETHR-*-Windows.exe' \) -exec cp {} upload/ \;
          test -f "upload/AETHR-${VER}-macOS.dmg" || { echo "missing macOS DMG"; exit 1; }
          test -f "upload/AETHR-${VER}-Windows.exe" || { echo "missing Windows EXE"; exit 1; }
          (
            cd upload
            shasum -a 256 "AETHR-${VER}-macOS.dmg" "AETHR-${VER}-Windows.exe" | tee "AETHR-${VER}-SHA256SUMS.txt"
          )
          ls -lh upload

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AETHR ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            upload/AETHR-*-macOS.dmg
            upload/AETHR-*-Windows.exe
            upload/AETHR-*-SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            ## Installers

            | Platform | Package |
            |----------|---------|
            | macOS | `AETHR-${{ github.ref_name }}-macOS.dmg` |
            | Windows | `AETHR-${{ github.ref_name }}-Windows.exe` |
            | Checksums | `AETHR-${{ github.ref_name }}-SHA256SUMS.txt` |

            ### Install

            - **macOS:** open the DMG → run **Install AETHR.pkg** (places Standalone in `/Applications`, VST3/AU in `/Library/Audio/Plug-Ins/…`).
            - **Windows:** run the EXE installer (VST3 → `%CommonProgramFiles%\VST3`, app → `%ProgramFiles%\AETHR`).

            Full guide: [`docs/INSTALLATION.md`](https://github.com/Soumen2581/AETHR/blob/master/docs/INSTALLATION.md).

            ### Platforms

            - macOS 11+ — VST3, AU, Standalone (universal when built with the `release` preset)
            - Windows 10/11 x64 — VST3, Standalone

            ### Known residuals

            - Unsigned / un-notarized builds if Apple/Windows signing secrets are not configured
            - Hard/wavefold saturation may alias (Soft is the default)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
