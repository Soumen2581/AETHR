name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            build_au: ON
          - os: windows-2022
            name: Windows
            build_au: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/ci/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAETHR_WARNINGS_AS_ERRORS=ON \
            -DAETHR_COPY_AFTER_BUILD=OFF \
            -DAETHR_BUILD_TESTS=ON \
            -DAETHR_BUILD_STANDALONE=ON \
            -DAETHR_BUILD_AU=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build/ci -G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DAETHR_WARNINGS_AS_ERRORS=ON ^
            -DAETHR_COPY_AFTER_BUILD=OFF ^
            -DAETHR_BUILD_TESTS=ON ^
            -DAETHR_BUILD_STANDALONE=ON ^
            -DAETHR_BUILD_AU=OFF

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build/ci --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build/ci --parallel

      - name: Test (macOS)
        if: runner.os == 'macOS'
        working-directory: build/ci
        run: ctest --output-on-failure --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: build/ci
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          ctest --output-on-failure --parallel

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.name }}
          path: build/ci/Testing/Temporary/
          if-no-files-found: ignore
