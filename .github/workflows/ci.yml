name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-2022
            name: Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/ci/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # macOS: VST3 + AU + Standalone
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAETHR_WARNINGS_AS_ERRORS=ON \
            -DAETHR_COPY_AFTER_BUILD=OFF \
            -DAETHR_BUILD_TESTS=ON \
            -DAETHR_BUILD_STANDALONE=ON \
            -DAETHR_BUILD_AU=ON

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build/ci --parallel

      - name: Test (macOS)
        if: runner.os == 'macOS'
        working-directory: build/ci
        run: ctest --output-on-failure --parallel

      # Windows: VST3 + Standalone (AU is Apple-only)
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build/ci -G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DAETHR_WARNINGS_AS_ERRORS=ON ^
            -DAETHR_COPY_AFTER_BUILD=OFF ^
            -DAETHR_BUILD_TESTS=ON ^
            -DAETHR_BUILD_STANDALONE=ON ^
            -DAETHR_BUILD_AU=OFF

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build/ci --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: build/ci
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          ctest --output-on-failure --parallel

      - name: Package plugin artefacts (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          ART="build/ci/Aethr_artefacts/RelWithDebInfo"
          ditto -c -k --keepParent "$ART/VST3/AETHR.vst3" dist/AETHR-macOS-VST3.zip
          ditto -c -k --keepParent "$ART/AU/AETHR.component" dist/AETHR-macOS-AU.zip
          ditto -c -k --keepParent "$ART/Standalone/AETHR.app" dist/AETHR-macOS-Standalone.zip
          ls -la dist

      - name: Package plugin artefacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $art = 'build/ci/Aethr_artefacts/RelWithDebInfo'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$art/VST3/AETHR.vst3" -DestinationPath 'dist/AETHR-Windows-VST3.zip' -Force
          Compress-Archive -Path "$art/Standalone/AETHR.exe" -DestinationPath 'dist/AETHR-Windows-Standalone.zip' -Force
          Get-ChildItem dist

      - name: Upload plugin artefacts
        uses: actions/upload-artifact@v4
        with:
          name: AETHR-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.name }}
          path: build/ci/Testing/Temporary/
          if-no-files-found: ignore
