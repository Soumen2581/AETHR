name: CI

on:
  push:
    branches: [master, main, develop, development, 'feature/**', 'fix/**', 'ci/**']
  pull_request:
    branches: [master, main, develop, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push/PR: one live run per ref (cancel obsolete commits).
  # Manual "Run workflow": its own group so it never cancels a push build mid-flight.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static quality gate
        run: |
          chmod +x Tools/ci-static-check.sh
          ./Tools/ci-static-check.sh

  build-and-test:
    name: ${{ matrix.name }}
    needs: static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            verify_os: macOS
          - os: windows-2022
            name: Windows
            verify_os: Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Enable MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: |
            build/ci/_deps
            External/JUCE
            External/Catch2
          key: deps-v2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            deps-v2-${{ runner.os }}-

      - name: Configure
        run: |
          cmake --preset ci
          test -f build/ci/CMakeCache.txt || (echo "Configure did not produce CMakeCache.txt" && exit 1)

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Unit / DSP / Engine tests (CTest)
        run: ctest --preset ci --output-on-failure --parallel

      - name: Verify plugin artefacts
        shell: bash
        run: |
          chmod +x Tools/ci-verify-artefacts.sh
          ./Tools/ci-verify-artefacts.sh \
            build/ci/Aethr_artefacts/RelWithDebInfo \
            "${{ matrix.verify_os }}"

      - name: Pluginval (macOS VST3)
        if: runner.os == 'macOS'
        run: |
          chmod +x Tools/fetch-pluginval.sh
          ./Tools/fetch-pluginval.sh v1.0.4
          PLUGINVAL="Tools/pluginval.app/Contents/MacOS/pluginval"
          test -x "${PLUGINVAL}"
          "${PLUGINVAL}" \
            --strictness-level 8 \
            --validate-in-process \
            --skip-gui-tests \
            --output-dir build/ci/pluginval \
            "build/ci/Aethr_artefacts/RelWithDebInfo/VST3/AETHR.vst3"

      - name: Package plugin artefacts (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          ART="build/ci/Aethr_artefacts/RelWithDebInfo"
          ditto -c -k --keepParent "$ART/VST3/AETHR.vst3" dist/AETHR-macOS-VST3.zip
          ditto -c -k --keepParent "$ART/AU/AETHR.component" dist/AETHR-macOS-AU.zip
          ditto -c -k --keepParent "$ART/Standalone/AETHR.app" dist/AETHR-macOS-Standalone.zip
          ls -la dist

      - name: Package plugin artefacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $art = 'build/ci/Aethr_artefacts/RelWithDebInfo'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$art/VST3/AETHR.vst3" -DestinationPath 'dist/AETHR-Windows-VST3.zip' -Force
          Compress-Archive -Path "$art/Standalone/AETHR.exe" -DestinationPath 'dist/AETHR-Windows-Standalone.zip' -Force
          Get-ChildItem dist

      - name: Upload plugin artefacts
        uses: actions/upload-artifact@v4
        with:
          name: AETHR-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload test / pluginval logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.name }}
          path: |
            build/ci/Testing/Temporary/
            build/ci/pluginval/
          if-no-files-found: ignore
