name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (arm64)
            build_au: ON
          - os: ubuntu-24.04
            name: Linux
            build_au: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libwebkit2gtk-4.1-dev

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/ci/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAETHR_WARNINGS_AS_ERRORS=ON \
            -DAETHR_COPY_AFTER_BUILD=OFF \
            -DAETHR_BUILD_TESTS=ON \
            -DAETHR_BUILD_STANDALONE=ON \
            -DAETHR_BUILD_AU=${{ matrix.build_au }}

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Test
        working-directory: build/ci
        run: ctest --output-on-failure --parallel

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.name }}
          path: build/ci/Testing/Temporary/
          if-no-files-found: ignore
